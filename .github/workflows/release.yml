name: Release

# Builds a signed release APK (for sideloading/Obtainium) and app bundle (for the
# Play Console upload) and publishes both to a GitHub Release whenever a version
# tag is pushed, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64  - base64 of your .jks keystore
#   SIGNING_STORE_PASSWORD   - keystore password
#   SIGNING_KEY_ALIAS        - the alias of the Voice Vault key in that keystore
#   SIGNING_KEY_PASSWORD     - that key's password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and bundle
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare artifacts
        id: artifacts
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$apk" ]; then echo "No APK produced" >&2; exit 1; fi
          out="voice-vault-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          aab=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          if [ -z "$aab" ]; then echo "No bundle produced" >&2; exit 1; fi
          aab_out="voice-vault-${GITHUB_REF_NAME}.aab"
          cp "$aab" "$aab_out"
          echo "aab=$aab_out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.apk }}.sha256
            ${{ steps.artifacts.outputs.aab }}
          generate_release_notes: true
          fail_on_unmatched_files: true
